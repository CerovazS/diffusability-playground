defaults:
  - override hydra/job_logging: disabled
  - override hydra/hydra_logging: disabled
  - _self_
action: train
run_id: null
output_root: outputs/posterior
geometry: overlap
profile: low
seed: 0
geometry_seed: 42
dim: 16
components: 8
trace: 8.0
logdet_gap: 4.0
multiplicities: [2, 4, 8]
radii:
  overlap: 0.75
  separated: 3.0
batch_size: 512
max_steps: 12000
validation_interval: 1000
generative_interval: 2000
log_interval: 100
training_minutes: 25
learning_rate: 0.0005
eval_samples: 4096
test_samples: 8192
sample_count: 4096
distribution_samples: 2048
projections: 256
solver_steps: 128
cpu_threads: 4
model:
  _target_: SiT.models.VectorMLP
  in_channels: ${dim}
  hidden_size: 128
  depth: 4
  mlp_ratio: 4.0
  num_classes: 1
  class_dropout_prob: 0.0
  learn_sigma: false
suite:
  geometries: [overlap, separated]
  profiles: [low, mid, high]
  seeds: [0, 1, 2]
  watchdog_seconds: 1740
hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
