results_dir: results
run_name: null
wandb_run_name: null
wandb_group: null
wandb_job_type: null
wandb_tags: []
epochs: 200
global_batch_size: 256
global_seed: 0
num_workers: 4
log_every: 100
ckpt_every: null
ckpt_every_n_epochs: 5
sample_every: 10000
use_wandb: true
wandb_entity: ar_spectra
wandb_project: diffusion-playground

# Validation
val_check_interval: null  # validate every N training steps (null = every epoch)
check_val_every_n_epoch: 1  # run validation every epoch (needed for epoch-level early stopping)
val_generative_metrics_every_n_epoch: 5  # heavy generative metrics cadence during validation
num_sanity_val_steps: 0   # skip sanity check (validation is slow due to sampling)
val_metrics_seed: 0        # fixed seed for validation sampling used by metrics (null = stochastic)
distribution_plots:
  enabled: true
  splits: [val]
  every_n_epochs: 20
  max_classes: 6
  max_points_per_class: 10000
  projection: pca
  dim0: 0
  dim1: 1
  kde_levels: 70
  kde_thresh: 0.02
  min_points_for_kde: 32
  density_cmap: Blues
  scatter_alpha: 0.35
  dpi: 200
  seed: 0
  grid_size: 160

# Best-checkpoint selection for post-training test
best_checkpoint:
  enabled: true
  monitor: val_loss
  mode: min
  save_top_k: 1
  filename: best-{epoch:03d}-{step:07d}
  auto_insert_metric_name: false
  save_last: false

# Post-training test
test_after_fit:
  enabled: true
  use_best_checkpoint: true
  strict: true  # fail if best checkpoint is requested but unavailable

early_stopping:
  enabled: false
  monitor: val_loss
  mode: min
  patience: 5
  min_delta: 0.0
  strict: false
  verbose: true

# Optimizer
lr: 5.0e-4
weight_decay: 0.0

# Lightning Trainer
accelerator: gpu
devices: 1
strategy: ddp
precision: 32
