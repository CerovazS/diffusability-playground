defaults:
  - data: synth_pc_doc_anis
  - _self_

ambient_dim: 2

plot:
  # Collect 128 samples/class to visualize anisotropy in the point-wise setting.
  max_points_per_class: 128
  projection: dims
  dim0: 0
  dim1: 1
  kde_levels: 24
  kde_thresh: 0.0
  cmap: rocket_r
  num_workers: 0
  out_name: docs/assets/pointcloud_dataset/sweep_anis_single_cloud.png
  dpi: 220
