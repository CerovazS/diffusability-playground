  #     family: affine_subspace
  #     d: 2
  #     D: 2
  #     K: 16
  #     separation: 20.0
  #     thickness: 0.05
  #     mode_weights: null
  #     orientation_per_mode: true
  #     tail:
  #       kind: gauss
  #     anisotropy:
  #       enabled: false
  #       min_scale: 0.5
  #       max_scale: 20.0
  #       permute_per_mode: false
  #     curvature:
  #       enabled: false

  #   1:
  #     family: sine_warp_subspace
  #     d: 2
  #     D: 2
  #     K: 4
  #     separation: 6.0
  #     thickness: 0.05
  #     mode_weights: null
  #     orientation_per_mode: true
  #     tail:
  #       kind: student_t
  #       student_df: 3.0
  #     anisotropy:
  #       enabled: true
  #       min_scale: 0.3
  #       max_scale: 3.0
