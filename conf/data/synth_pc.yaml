# conf/data/synth_pc.yaml
_target_: datamodules.synthetic_pointclouds.ConditionalPointCloudDataset
_convert_: all

cfg:
  _target_: datamodules.synthetic_pointclouds.DatasetConfig
  _convert_: all
  num_samples: 10000
  points_per_cloud: 512
  # num_classes is auto-computed from class_sweeps (4 separations × 2 thicknesses = 8)
  num_classes: 8
  base_seed: 1234
  device: cpu  # Must be cpu for DataLoader multiprocessing; GPU transfer happens in training loop
  samples_per_class: null

  # classes:
