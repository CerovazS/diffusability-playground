  #   2:
  #     family: mog
  #     d: 0   # unused in mog, keep any value
  #     D: 2
  #     K: 8
  #     separation: 8.0
  #     thickness: 0.02
  #     mog_diag_cov: 1.0
  #     mode_weights: null
  #     orientation_per_mode: true
  #     tail:
  #       kind: gauss
  #     anisotropy:
  #       enabled: false
  #     curvature:
  #       enabled: false

  # Optional: expand additional classes via sweep(s).
  # Each entry defines a base class and a parameter grid (cartesian product).
  # NOTE: D uses global ambient_dim for consistency with model input channels
  class_sweeps:
    - name: sweep_affine_sep
      base:
        family: affine_subspace
        d: 2
        D: ${ambient_dim}
        K: 8
        separation: 4.0
        thickness: 0.05
        orientation_per_mode: true
        tail:
          kind: gauss
        anisotropy:
          enabled: false
        curvature:
          enabled: false
      sweep:
        separation: [2.0, 4.0, 6.0, 8.0]
        thickness: [0.02, 0.05]
