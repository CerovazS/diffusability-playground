defaults:
  - /data/synth_pc@dataset
  - _self_

_target_: datamodules.synthetic_pointclouds.SyntheticPointCloudDataModule
_convert_: all

# Input channels from global ambient_dim (single source of truth)
in_channels: ${ambient_dim}
use_vae: false

batch_size: 128
val_batch_size: 128
test_batch_size: 128
num_workers: 4
pin_memory: true
drop_last: true
shuffle: true

train_seed: 1234
val_seed: 2345
test_seed: 3456

train_samples_per_class: 10000
val_samples_per_class: 2000
test_samples_per_class: 2000

metrics:
  swd:
    enabled: true
    num_projections: 512
    seed: 0

  energy_distance:
    enabled: true
    distance: l2
    max_samples: 256
    seed: 0

  feature_mmd:
    enabled: true
    max_samples: 512
    seed: 0
    gamma: null
    gamma_mode: feature_dim
    gamma_scale: 1.0
    unbiased: true
    standardize_features: reference
    eig_eps: 1.0e-8
