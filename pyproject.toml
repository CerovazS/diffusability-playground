[project]
name = "diffusability-playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "torchaudio==2.7.1",
  "diffusers>=0.36.0",
  "wandb>=0.24.1",
  "timm>=1.0.24",
  "torchdiffeq>=0.2.5",
  "accelerate>=1.12.0",
  "scikit-learn>=1.8.0",
  "omegaconf>=2.3.0",
  "seaborn>=0.13.2",
  "hydra-core>=1.3.2",
  "rich>=14.3.2",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
